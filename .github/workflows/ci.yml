name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev

      # Coverage ratchet (ROADMAP Phase 24): measured 90% on 2026-09-01
      # after the CLI/collector waves; floor one point under to absorb
      # platform variance between the macOS dev box and these runners.
      # Raise the floor as waves land — never lower it to make a change
      # pass.
      - name: Run tests
        run: uv run --no-sync pytest -m "not smoke" --cov=world_intel_mcp --cov-fail-under=89

  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile check
        run: python -m compileall -q src
